  :root {
    --bg: #091C17;
    --panel: #14332B;
    --orange: #F0781D;
    --grey: #989898;
    --white: #FFFFFF;
    --black: #000000;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html { scroll-behavior: smooth; }

  body {
    font-family: 'Avenir NLT', -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--bg);
    color: var(--white);
    line-height: 1.6;
    min-height: 100vh;
  }

  .headline {
    font-family: 'NLT Headline', 'Arial Narrow', sans-serif;
    text-transform: uppercase;
    letter-spacing: 0.01em;
    font-weight: 700;
  }

  .wrap { max-width: 640px; margin: 0 auto; padding: 0 20px 80px; }

  /* Top bar */
  .topbar { background: var(--bg); padding: 20px 0; }
  .topbar-inner {
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid rgba(255,255,255,0.12);
    padding: 0 20px 20px;
    max-width: 640px;
    margin: 0 auto;
  }
  .logo-mark { display: flex; align-items: center; }
  .logo-mark svg.full-logo { height: 18px; width: auto; display: block; }
  .topbar-tag {
    font-size: 12px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--grey);
  }

  .eyebrow {
    font-family: 'NLT Headline', sans-serif;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--orange);
    font-size: 13px;
    font-weight: 700;
    margin: 28px 0 6px;
  }

  h2 {
    font-family: 'NLT Headline', sans-serif;
    text-transform: uppercase;
    letter-spacing: 0.01em;
    font-size: 20px;
    font-weight: 700;
    margin-bottom: 20px;
    color: var(--white);
  }

  .card {
    background: var(--panel);
    border-radius: 6px;
    padding: 24px;
    margin-top: 24px;
  }

  .field { margin-top: 16px; }
  .field:first-child { margin-top: 0; }

  .field label {
    display: block;
    font-size: 14px;
    font-weight: 700;
    margin-bottom: 8px;
    color: var(--white);
  }

  input[type="text"],
  input[type="email"],
  input[type="number"],
  input[type="file"],
  textarea {
    width: 100%;
    padding: 12px 14px;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.18);
    border-radius: 4px;
    color: var(--white);
    font-family: 'Avenir NLT', sans-serif;
    font-size: 15px;
  }

  textarea { resize: vertical; min-height: 80px; }
  input::placeholder, textarea::placeholder { color: rgba(255,255,255,0.35); }
  input:focus, textarea:focus { outline: none; border-color: var(--orange); }

  button {
    background: var(--orange);
    color: var(--black);
    font-family: 'NLT Headline', sans-serif;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    font-weight: 700;
    font-size: 14px;
    padding: 14px 24px;
    border: none;
    border-radius: 3px;
    cursor: pointer;
    margin-top: 20px;
    width: 100%;
    transition: opacity 0.15s ease;
  }
  button:hover { opacity: 0.88; }
  button:disabled { opacity: 0.5; cursor: not-allowed; }

  button.secondary {
    background: transparent;
    color: var(--grey);
    border: 1px solid rgba(255,255,255,0.25);
    width: auto;
    margin: 0;
    padding: 8px 14px;
    font-size: 12px;
  }

  .error { color: #ff9d7a; font-size: 14px; margin-top: 10px; }
  .msg { color: var(--orange); font-size: 14px; margin-top: 10px; }
  .hidden { display: none !important; }

  .toprow { display: flex; justify-content: space-between; align-items: center; }
  .email-line { font-size: 13px; color: var(--grey); margin: 4px 0 20px; }

  .stat-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
  }
  .stat {
    background: rgba(255,255,255,0.05);
    border-radius: 6px;
    padding: 14px 16px;
  }
  .stat .num {
    font-family: 'NLT Headline', sans-serif;
    font-size: 24px;
    font-weight: 700;
    color: var(--orange);
    line-height: 1;
  }
  .stat .lbl {
    font-size: 11px;
    color: var(--grey);
    text-transform: uppercase;
    letter-spacing: 0.05em;
    margin-top: 4px;
  }

  .sub-item {
    border: 1px solid rgba(255,255,255,0.14);
    border-radius: 6px;
    padding: 16px 18px;
    margin-bottom: 12px;
  }

<script>
/* ====================== CONFIG ====================== */
const AIRTABLE_PAT = "patPQJYDM8mvFZUgL.e2d95a45fff2ff8d05f8bfe0d049ea104588adf4599620338423ab8abc06834c";
const AIRTABLE_BASE_ID = "app9LXJtFUqO3VN0V";
const EDITORS_TABLE = "Editors";
const SUBMISSIONS_TABLE = "Video Submissions";

const CLOUDINARY_CLOUD_NAME = "os1vbtid";
const CLOUDINARY_UPLOAD_PRESET = "nlt_editor_portal";
/* ====================================================== */

const AT_BASE_URL = `https://api.airtable.com/v0/${AIRTABLE_BASE_ID}`;

function atHeaders() {
  return {
    "Authorization": `Bearer ${AIRTABLE_PAT}`,
    "Content-Type": "application/json"
  };
}

const loginView = document.getElementById("loginView");
const dashboardView = document.getElementById("dashboardView");
const emailInput = document.getElementById("emailInput");
const loginBtn = document.getElementById("loginBtn");
const loginError = document.getElementById("loginError");
const welcomeName = document.getElementById("welcomeName");
const welcomeEmail = document.getElementById("welcomeEmail");
const logoutBtn = document.getElementById("logoutBtn");
const statVideos = document.getElementById("statVideos");
const statHours = document.getElementById("statHours");
const statPaid = document.getElementById("statPaid");
const statOwed = document.getElementById("statOwed");

const titleInput = document.getElementById("titleInput");
const fileInput = document.getElementById("fileInput");
const captionInput = document.getElementById("captionInput");
const minutesInput = document.getElementById("minutesInput");
const uploadBtn = document.getElementById("uploadBtn");
const uploadProgress = document.getElementById("uploadProgress");
const uploadError = document.getElementById("uploadError");

const submissionsList = document.getElementById("submissionsList");
const submissionsEmpty = document.getElementById("submissionsEmpty");
const needsBadge = document.getElementById("needsBadge");
const filterRow = document.getElementById("filterRow");

let currentEditor = null; // { id, name, email }
let allSubmissions = [];  // full unfiltered list from the last refresh
let activeFilter = "all";

function showError(el, msg) {
  el.textContent = msg;
  el.classList.remove("hidden");
}
function hideError(el) {
  el.classList.add("hidden");
}

function escapeHtml(str) {
  return String(str ?? "").replace(/[&<>"']/g, c => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  }[c]));
}

// Hours are stored in Airtable (for the payout formula); minutes are what editors enter.
function minutesToHours(minutes) {
  if (minutes === undefined || minutes === null || minutes === "") return undefined;
  return Math.round((parseFloat(minutes) / 60) * 100) / 100;
}
function formatDuration(hoursVal) {
  if (hoursVal === undefined || hoursVal === null || hoursVal === "") return "—";
  const totalMinutes = Math.round(Number(hoursVal) * 60);
  const h = Math.floor(totalMinutes / 60);
  const m = totalMinutes % 60;
  if (h === 0) return `${m}m`;
  if (m === 0) return `${h}h`;
  return `${h}h ${m}m`;
}

async function findEditorByEmail(email) {
  const formula = encodeURIComponent(`LOWER({Email})=LOWER("${email.replace(/"/g, '\\"')}")`);
  const url = `${AT_BASE_URL}/${encodeURIComponent(EDITORS_TABLE)}?filterByFormula=${formula}`;
  const res = await fetch(url, { headers: atHeaders() });
  if (!res.ok) throw new Error("Could not reach Airtable. Check the API token.");
  const data = await res.json();
  if (!data.records || data.records.length === 0) return null;
  const rec = data.records[0];
  return { id: rec.id, name: rec.fields["Name"] || email, email };
}

async function fetchSubmissions(editorName) {
  const formula = encodeURIComponent(`SEARCH("${editorName.replace(/"/g, '\\"')}", ARRAYJOIN({Editor}))`);
  const url = `${AT_BASE_URL}/${encodeURIComponent(SUBMISSIONS_TABLE)}?filterByFormula=${formula}&sort[0][field]=Submitted Date&sort[0][direction]=desc`;
  const res = await fetch(url, { headers: atHeaders() });
  if (!res.ok) throw new Error("Could not load submissions.");
  const data = await res.json();
  return data.records || [];
}

async function fetchEditorTotals(editorId) {
  const url = `${AT_BASE_URL}/${encodeURIComponent(EDITORS_TABLE)}/${editorId}`;
  const res = await fetch(url, { headers: atHeaders() });
  if (!res.ok) throw new Error("Could not load your totals.");
  const data = await res.json();
  return data.fields || {};
}

function money(n) {
  if (n === undefined || n === null || n === "") return "$0";
  return "$" + Number(n).toFixed(2).replace(/\.00$/, "");
}

function renderSubmissions(records) {
  submissionsList.innerHTML = "";
  if (records.length === 0) {
    submissionsEmpty.classList.remove("hidden");
    return;
  }
  submissionsEmpty.classList.add("hidden");
  records.forEach(r => {
    const f = r.fields;
    const status = f["Status"] || "Submitted";
    const statusClass = status.replace(/\s+/g, "-");
    const needsResubmit = status === "Needs Resubmission";
    const existingMinutes = f["Hours Worked"] ? Math.round(Number(f["Hours Worked"]) * 60) : "";
    const div = document.createElement("div");
    div.className = "sub-item";
    div.innerHTML = `
      <span class="badge ${statusClass}">${status}</span>
      <h3>${escapeHtml(f["Title"]) || "(untitled)"}</h3>
      ${f["Video Link"] ? `<a class="videolink" href="${f["Video Link"]}" target="_blank" rel="noopener">View video</a>` : ""}
      <div class="meta">Submitted ${f["Submitted Date"] || "—"}${f["Hours Worked"] ? ` · ${formatDuration(f["Hours Worked"])} logged` : ""}</div>
      ${f["Reviewer Notes"] ? `<div class="notes"><strong>Feedback:</strong> ${escapeHtml(f["Reviewer Notes"])}</div>` : ""}
      ${needsResubmit ? `
        <button class="secondary resubmit-btn" data-toggle="${r.id}">Resubmit this video</button>
        <div class="resubmit-form hidden" id="resubmit-${r.id}">
          <div class="field">
            <label>New video file</label>
            <input type="file" accept="video/*" class="resubmit-file">
          </div>
          <div class="field">
            <label>Caption</label>
            <textarea class="resubmit-caption">${escapeHtml(f["Caption"])}</textarea>
          </div>
          <div class="field">
            <label>Minutes worked</label>
            <input type="number" class="resubmit-minutes" min="0" step="1" value="${existingMinutes}">
          </div>
          <button class="resubmit-submit-btn" data-id="${r.id}">Submit resubmission</button>
          <div class="msg hidden resubmit-progress"></div>
          <div class="error hidden resubmit-error"></div>
        </div>
      ` : ""}
    `;
    submissionsList.appendChild(div);
  });
}

function applyFilter() {
  const filtered = activeFilter === "all"
    ? allSubmissions
    : allSubmissions.filter(r => (r.fields["Status"] || "Submitted") === activeFilter);
  renderSubmissions(filtered);
}

function updateNeedsBadge() {
  const count = allSubmissions.filter(r => (r.fields["Status"] || "Submitted") === "Needs Resubmission").length;
  if (count > 0) {
    needsBadge.textContent = `${count} need${count > 1 ? "" : "s"} changes`;
    needsBadge.classList.remove("hidden");
  } else {
    needsBadge.classList.add("hidden");
  }
}

filterRow.addEventListener("click", (e) => {
  const btn = e.target.closest(".filter-btn");
  if (!btn) return;
  filterRow.querySelectorAll(".filter-btn").forEach(b => b.classList.remove("active"));
  btn.classList.add("active");
  activeFilter = btn.dataset.filter;
  applyFilter();
});

async function refreshDashboard() {
  const [records, totals] = await Promise.all([
    fetchSubmissions(currentEditor.name),
    fetchEditorTotals(currentEditor.id)
  ]);
  allSubmissions = records;
  updateNeedsBadge();
  applyFilter();
  statVideos.textContent = records.length;
  statHours.textContent = formatDuration(totals["Total Hours Logged"]);
  statPaid.textContent = money(totals["Total Paid"]);
  statOwed.textContent = money(totals["Total Owed"]);
}

async function login(email) {
  hideError(loginError);
  loginBtn.disabled = true;
  loginBtn.textContent = "Checking...";
  try {
    const editor = await findEditorByEmail(email);
    if (!editor) {
      showError(loginError, "That email isn't on the editors list. Check with Raphael if you think this is wrong.");
      return;
    }
    currentEditor = editor;
    localStorage.setItem("nlt_editor_email", email);
    welcomeName.textContent = `Hi, ${editor.name}`;
    welcomeEmail.textContent = editor.email;
    loginView.classList.add("hidden");
    dashboardView.classList.remove("hidden");
    await refreshDashboard();
  } catch (e) {
    showError(loginError, e.message || "Something went wrong.");
  } finally {
    loginBtn.disabled = false;
    loginBtn.textContent = "Continue";
  }
}

loginBtn.addEventListener("click", () => {
  const email = emailInput.value.trim();
  if (!email) { showError(loginError, "Enter your email."); return; }
  login(email);
});
emailInput.addEventListener("keydown", e => { if (e.key === "Enter") loginBtn.click(); });

logoutBtn.addEventListener("click", () => {
  localStorage.removeItem("nlt_editor_email");
  currentEditor = null;
  dashboardView.classList.add("hidden");
  loginView.classList.remove("hidden");
  emailInput.value = "";
});

async function uploadToCloudinary(file, onProgress) {
  return new Promise((resolve, reject) => {
    const formData = new FormData();
    formData.append("file", file);
    formData.append("upload_preset", CLOUDINARY_UPLOAD_PRESET);
    const xhr = new XMLHttpRequest();
    xhr.open("POST", `https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD_NAME}/video/upload`);
    xhr.upload.onprogress = (e) => {
      if (e.lengthComputable && onProgress) onProgress(Math.round((e.loaded / e.total) * 100));
    };
    xhr.onload = () => {
      if (xhr.status >= 200 && xhr.status < 300) {
        resolve(JSON.parse(xhr.responseText));
      } else {
        reject(new Error("Video upload failed. Check the Cloudinary preset/cloud name."));
      }
    };
    xhr.onerror = () => reject(new Error("Network error during upload."));
    xhr.send(formData);
  });
}

async function createSubmission({ title, videoUrl, caption, minutes }) {
  const body = {
    fields: {
      "Title": title,
      "Editor": [currentEditor.id],
      "Video Link": videoUrl,
      "Caption": caption,
      "Hours Worked": minutesToHours(minutes),
      "Status": "Submitted",
      "Submitted Date": new Date().toISOString().split("T")[0]
    }
  };
  const res = await fetch(`${AT_BASE_URL}/${encodeURIComponent(SUBMISSIONS_TABLE)}`, {
    method: "POST",
    headers: atHeaders(),
    body: JSON.stringify(body)
  });
  if (!res.ok) {
    const errText = await res.text();
    throw new Error("Could not save the submission to Airtable: " + errText);
  }
  return res.json();
}

// Used when an editor uploads a replacement for a video marked "Needs Resubmission".
// Puts the record back into the review queue as "Submitted" and clears the old review date.
async function updateSubmission(recordId, { videoUrl, caption, minutes }) {
  const body = {
    fields: {
      "Video Link": videoUrl,
      "Caption": caption,
      "Hours Worked": minutesToHours(minutes),
      "Status": "Submitted",
      "Submitted Date": new Date().toISOString().split("T")[0],
      "Review Date": null
    }
  };
  const res = await fetch(`${AT_BASE_URL}/${encodeURIComponent(SUBMISSIONS_TABLE)}/${recordId}`, {
    method: "PATCH",
    headers: atHeaders(),
    body: JSON.stringify(body)
  });
  if (!res.ok) {
    const errText = await res.text();
    throw new Error("Could not save the resubmission: " + errText);
  }
  return res.json();
}

uploadBtn.addEventListener("click", async () => {
  hideError(uploadError);
  uploadProgress.classList.add("hidden");

  const title = titleInput.value.trim();
  const file = fileInput.files[0];
  const caption = captionInput.value.trim();
  const minutes = minutesInput.value;

  if (!title) { showError(uploadError, "Give the video a title."); return; }
  if (!file) { showError(uploadError, "Choose a video file."); return; }

  uploadBtn.disabled = true;
  uploadProgress.classList.remove("hidden");
  uploadProgress.textContent = "Uploading video... 0%";

  try {
    const cloudResult = await uploadToCloudinary(file, (pct) => {
      uploadProgress.textContent = `Uploading video... ${pct}%`;
    });
    uploadProgress.textContent = "Saving to your submissions...";
    await createSubmission({ title, videoUrl: cloudResult.secure_url, caption, minutes });
    uploadProgress.textContent = "Submitted. It'll show up below once reviewed.";
    titleInput.value = "";
    fileInput.value = "";
    captionInput.value = "";
    minutesInput.value = "";
    await refreshDashboard();
  } catch (e) {
    uploadProgress.classList.add("hidden");
    showError(uploadError, e.message || "Something went wrong.");
  } finally {
    uploadBtn.disabled = false;
  }
});

// Toggle a resubmit form open/closed, and handle its submit button.
submissionsList.addEventListener("click", async (e) => {
  const toggleBtn = e.target.closest(".resubmit-btn");
  if (toggleBtn) {
    const formEl = document.getElementById(`resubmit-${toggleBtn.dataset.toggle}`);
    formEl.classList.toggle("hidden");
    return;
  }

  const submitBtn = e.target.closest(".resubmit-submit-btn");
  if (submitBtn) {
    const recordId = submitBtn.dataset.id;
    const formEl = document.getElementById(`resubmit-${recordId}`);
    const fileEl = formEl.querySelector(".resubmit-file");
    const captionEl = formEl.querySelector(".resubmit-caption");
    const minutesEl = formEl.querySelector(".resubmit-minutes");
    const progressEl = formEl.querySelector(".resubmit-progress");
    const errorEl = formEl.querySelector(".resubmit-error");

    hideError(errorEl);
    const file = fileEl.files[0];
    if (!file) { showError(errorEl, "Choose the updated video file."); return; }

    submitBtn.disabled = true;
    progressEl.classList.remove("hidden");
    progressEl.textContent = "Uploading video... 0%";

    try {
      const cloudResult = await uploadToCloudinary(file, (pct) => {
        progressEl.textContent = `Uploading video... ${pct}%`;
      });
      progressEl.textContent = "Saving resubmission...";
      await updateSubmission(recordId, {
        videoUrl: cloudResult.secure_url,
        caption: captionEl.value.trim(),
        minutes: minutesEl.value
      });
      progressEl.textContent = "Resubmitted. It'll show up as Submitted once saved.";
      await refreshDashboard();
    } catch (e2) {
      progressEl.classList.add("hidden");
      showError(errorEl, e2.message || "Something went wrong.");
    } finally {
      submitBtn.disabled = false;
    }
  }
});

// Auto-login if we remember this browser's editor
(function init() {
  const savedEmail = localStorage.getItem("nlt_editor_email");
  if (savedEmail) {
    emailInput.value = savedEmail;
    login(savedEmail);
  }
})();
</script>
