  :root {
    --bg: #002A23;
    --card: #00342B;
    --field: #0B4237;
    --line: rgba(255,255,255,0.12);
    --orange: #F0781D;
    --orange-soft: #FFB27A;
    --white: #FFFFFF;
    --soft: #C9D4D1;
    --muted: #A9BAB5;
    --green: #63D99A;
    --salmon: #FF9F80;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); }
  body { color: var(--white); font-family: 'Avenir NLT', 'Helvetica Neue', Arial, sans-serif; font-size: 15px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
  a { color: var(--orange); }
  a:hover { color: #FF9A52; }
  button, a, input, textarea { font-family: inherit; }
  button:focus-visible, a:focus-visible, input:focus-visible, textarea:focus-visible { outline: 2px solid var(--orange); outline-offset: 2px; }
  .hidden { display: none !important; }
  .head { font-family: 'NLT Headline', 'Arial Narrow', sans-serif; font-weight: 700; text-transform: uppercase; }
  .eyebrow { font-family: 'NLT Headline', sans-serif; font-size: 13px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--orange); }
  .muted { color: var(--muted); }
  .small { font-size: 13px; }

  /* Login */
  .split { min-height: 100vh; display: flex; flex-wrap: wrap; }
  .split-photo { flex: 1 1 520px; position: relative; min-height: 320px; overflow: hidden; background: var(--card); }
  .split-photo img.photo { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 50% 35%; }
  .split-photo .chip { position: absolute; background: rgba(0,42,35,0.82); padding: 10px 14px; border-radius: 4px; font-size: 13px; }
  .split-photo .chip.logo { left: 32px; top: 32px; padding: 12px 14px; }
  .split-photo .chip.place { left: 32px; bottom: 32px; }
  .split-photo .chip svg { height: 18px; width: auto; display: block; }
  .split-form { flex: 999 1 460px; display: flex; align-items: center; justify-content: center; padding: 56px 24px; }
  .login { width: 100%; max-width: 420px; display: flex; flex-direction: column; gap: 26px; }
  .login h1 { margin: 0; font-size: 44px; line-height: 1.05; }
  .login p { margin: 0; font-size: 17px; color: var(--soft); }

  /* Forms */
  .field { display: flex; flex-direction: column; gap: 8px; }
  .field label { font-size: 14px; font-weight: 700; }
  .input { width: 100%; padding: 14px 16px; background: var(--field); border: 1px solid rgba(255,255,255,0.22); border-radius: 4px; color: var(--white); font-size: 16px; }
  .input::placeholder { color: rgba(255,255,255,0.4); }
  .input:focus { outline: none; border-color: var(--orange); }
  textarea.input { resize: vertical; min-height: 110px; line-height: 1.5; }
  .code-input { font-size: 28px; font-weight: 700; letter-spacing: 0.5em; text-align: center; }
  .hint { font-size: 13px; color: var(--muted); }
  .error { color: var(--salmon); font-size: 14px; }
  .ok { color: var(--green); font-size: 14px; }

  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: none; border-radius: 3px; cursor: pointer; text-decoration: none; font-family: 'NLT Headline', sans-serif; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; font-size: 15px; padding: 16px 28px; min-height: 48px; background: var(--orange); color: #0A0A0A; }
  .btn:hover { color: #0A0A0A; opacity: 0.92; }
  .btn:disabled { opacity: 0.45; cursor: not-allowed; }
  .btn.block { width: 100%; }
  .btn.ghost { background: transparent; color: var(--white); border: 1px solid rgba(255,255,255,0.35); font-size: 13px; padding: 12px 18px; min-height: 42px; }
  .btn.ghost:hover { color: var(--white); border-color: rgba(255,255,255,0.6); }
  .linkbtn { background: none; border: none; padding: 6px 0; color: var(--orange); cursor: pointer; font-size: 14px; text-decoration: underline; }

  /* App shell */
  header.top { border-bottom: 1px solid var(--line); }
  .top-in { max-width: 1200px; margin: 0 auto; padding: 18px 32px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px; }
  .brand { display: flex; align-items: center; gap: 16px; text-decoration: none; color: var(--white); }
  .brand svg { height: 18px; width: auto; display: block; }
  .brand .sep { width: 1px; height: 18px; background: rgba(255,255,255,0.25); }
  .brand .tag { font-size: 12px; letter-spacing: 0.16em; text-transform: uppercase; color: #B3C2BE; }
  nav.main { display: flex; flex-wrap: wrap; align-items: center; gap: 22px; font-size: 14px; }

  .zero { color: rgba(255,255,255,0.32); }

  .split-bar { display: flex; height: 10px; border-radius: 5px; overflow: hidden; gap: 2px; margin: 16px 0 18px; background: rgba(255,255,255,0.06); }

  .b-simple { background: rgba(99,217,154,0.16); color: var(--green); }

  .loss { color: var(--salmon); font-weight: 700; }
  .tt { width: 100%; border-collapse: collapse; font-size: 14px; font-variant-numeric: tabular-nums; }
  .tt th { text-align: left; font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); font-weight: 400; padding: 0 12px 10px 0; white-space: nowrap; }
  .tt td { padding: 12px 12px 12px 0; border-top: 1px solid rgba(255,255,255,0.1); vertical-align: top; }
  .tt .n { text-align: right; white-space: nowrap; }
  .tt a { color: var(--white); font-weight: 700; }
  .scroll-x { overflow-x: auto; }
  .check { display: flex; align-items: flex-start; gap: 10px; cursor: pointer; font-size: 14px; }
  .check input { width: 20px; height: 20px; accent-color: var(--orange); margin: 1px 0 0; flex: 0 0 auto; }
  .lvl { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 10px; }
  .lvl label { position: relative; border: 1px solid rgba(255,255,255,0.22); border-radius: 6px; padding: 12px 14px; cursor: pointer; display: flex; flex-direction: column; gap: 2px; font-weight: 400; }
  .lvl label b { font-size: 15px; }
  .lvl input { position: absolute; opacity: 0; width: 1px; height: 1px; }
  .lvl label:has(input:checked) { border-color: var(--orange); background: rgba(240,120,29,0.08); }
  .lvl label:has(input:focus-visible) { outline: 2px solid var(--orange); outline-offset: 2px; }
  .form2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 18px; }
  .levels3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; }
  .levels3 > div { background: rgba(255,255,255,0.04); border-radius: 6px; padding: 12px 14px; display: flex; flex-direction: column; align-items: flex-start; gap: 6px; }
  .scroll-x .tt { min-width: 620px; }
  @media (max-width: 900px) {
    .days7 { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
  }

  @media (max-width: 640px) {
    .top-in { padding: 14px 16px; }
    main.page { padding: 24px 16px 72px; }
    .card { padding: 18px; }
    .hero h1 { font-size: 36px; }
    .tile .num { font-size: 32px; }
    .tile { flex-basis: 140px; }
    .vhead h1 { font-size: 24px; }
    .ptable .r { gap: 8px; font-size: 13px; }
    .login h1 { font-size: 34px; }
    .split-photo { flex-basis: 100%; min-height: 220px; }
    .vrow { flex-wrap: nowrap; align-items: flex-start; gap: 12px; }
    .vinfo { flex: 1 1 auto; }
    .badges.d { display: none; }
    .badges.m { display: flex; gap: 6px; }
    .badges.m .badge { font-size: 10px; letter-spacing: 0.03em; padding: 4px 7px; }
    .amt { width: auto; }
    .payout .usd { width: auto; }
    .payout .php { min-width: 0; font-size: 20px; }
    .pbody { padding-left: 0; }
    .tile .num.date { font-size: 24px; }
    nav.main { gap: 16px; }
    .lg { display: none; }
    .who { font-size: 0; gap: 0; }
    .bars { gap: 3px; height: 180px; }
    .cbars { gap: 3px; }
    .seg { flex-wrap: wrap; }
    .seg button { padding: 8px 12px; }
    .xlabels { gap: 3px; }
    .bar .v { font-size: 11px; }
  }

</style>
</head>

const API = "https://pcqghtwfedjokbzrcrlm.supabase.co/functions/v1/portal";
const CLOUD_VIDEO = /^https:\/\/res\.cloudinary\.com\/os1vbtid\/video\/upload\//;
const MOCK = new URLSearchParams(location.search).has("mock");
const PAGE = 10;

const app = document.getElementById("app");
const MON = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
const MONTHS = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
const DAYS = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];

const state = { data: null, period: "week", filter: "all", shown: PAGE, upload: null, reupload: null, queue: null, rtab: "todo", drafts: {},
  view: "", team: null, channel: "all", range: "weeks", plan: null, planRunning: false, sched: null };

/* ---------- small helpers ---------- */
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const money = (n) => { const v = Number(n) || 0; return "$" + (Number.isInteger(v) ? v : v.toFixed(2)); };
const plural = (n, one, many) => `${n} ${n === 1 ? one : many}`;
const sum = (list) => Math.round(list.reduce((t, v) => t + (Number(v.amount) || 0), 0) * 100) / 100;
const peso = (n) => "₱" + Math.round(Number(n) || 0).toLocaleString("en-US");
const usd2 = (n) => "$" + (Number(n) || 0).toFixed(2);
function parseDay(s) { const [y, m, d] = String(s).split("-").map(Number); return new Date(y, (m || 1) - 1, d || 1); }
function iso(d) { return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`; }
function addDays(d, n) { const x = new Date(d); x.setDate(x.getDate() + n); return x; }
function weekStart(d) { const x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); return addDays(x, -((x.getDay() + 6) % 7)); }
const fmtDay = (d) => `${d.getDate()} ${MON[d.getMonth()]}`;
const fmtRange = (a, b) => a.getMonth() === b.getMonth() ? `${a.getDate()}–${b.getDate()} ${MON[b.getMonth()]}` : `${fmtDay(a)} – ${fmtDay(b)}`;
const dayLabel = (s) => (s ? fmtDay(parseDay(s)) : "–");
function thumbUrl(url, w = 96, h = 136) {
  if (!CLOUD_VIDEO.test(url || "")) return "";
  return url.replace("/video/upload/", `/video/upload/so_1,w_${w},h_${h},c_fill,q_auto/`).replace(/\.[a-z0-9]+(\?.*)?$/i, ".jpg");
}
const clock = (sec) => { const t = Math.max(0, Math.floor(Number(sec) || 0)); return `${Math.floor(t / 60)}:${String(t % 60).padStart(2, "0")}`; };
function seconds(txt) {
  const m = String(txt || "").trim().match(/^(\d+):(\d{1,2})$/);
  if (m) return Number(m[1]) * 60 + Number(m[2]);
  const n = Number(String(txt || "").trim());
  return Number.isFinite(n) ? n : null;
}
function daysSince(s) {
  if (!s) return 0;
  const a = parseDay(s), b = new Date();
  return Math.max(0, Math.round((new Date(b.getFullYear(), b.getMonth(), b.getDate()) - a) / 86400000));
}
const ageLabel = (s) => { const d = daysSince(s); return d === 0 ? "Today" : d === 1 ? "1 day" : `${d} days`; };
const MUSIC_URL = /^https?:\/\/\S+\.\S+/i;
const isEditor = () => !!state.data?.editor;
// Only approved videos are paid. Before approval, show what the video will earn.
const expected = (v) => v.status === "Approved" || v.amount ? v.amount
  : v.template && v.template.pay != null ? Number(v.template.pay)
  : (state.data?.editor?.payModel === "Per Hour" ? 0 : Number(state.data?.editor?.rate) || 0);
// Templates: what an editor gets for one. A template without its own Pay pays the editor's rate.
const templates = () => state.data?.templates || [];
const ownRate = () => Number(state.data?.editor?.rate) || 0;
const payFor = (t) => (t && t.pay != null ? Number(t.pay) : ownRate());
const levelBadge = (l) => (l ? `<span class="badge ${l === "Advanced" ? "b-adv" : l === "Medium" ? "b-med" : "b-simple"}">${esc(l)}</span>` : "");
const amountCell = (v) => v.status === "Approved" || v.amount ? money(v.amount) : `<span class="pending" title="Paid once approved">${money(expected(v))}</span>`;
const isReviewer = () => !!state.data?.reviewer;

function toast(msg) {
  const t = document.createElement("div");
  t.className = "toast"; t.setAttribute("role", "status"); t.textContent = msg;
  document.body.appendChild(t); setTimeout(() => t.remove(), 3500);
}

/* ---------- session ---------- */
const store = {
  get token() { try { return localStorage.getItem("nlt_portal_token"); } catch { return null; } },
  set token(v) { try { v ? localStorage.setItem("nlt_portal_token", v) : localStorage.removeItem("nlt_portal_token"); } catch { /* private mode */ } },
  get email() { try { return sessionStorage.getItem("nlt_portal_email") || ""; } catch { return ""; } },
  set email(v) { try { sessionStorage.setItem("nlt_portal_email", v); } catch { /* ignore */ } },
};

async function api(action, payload = {}) {
  if (MOCK) return mockApi(action, payload);
  const headers = { "Content-Type": "application/json" };
  if (store.token) headers.Authorization = `Bearer ${store.token}`;
  let res;
  try {
    res = await fetch(API, { method: "POST", headers, body: JSON.stringify({ action, ...payload }) });
  } catch {
    throw new Error("Can't reach the portal. Check your connection and try again.");
  }
  const body = await res.json().catch(() => ({}));
  if (res.status === 401 && !["request-code", "verify-code"].includes(action)) {
    store.token = null; state.data = null; go("#/login");
    throw new Error(body.error || "Log in again.");
  }
  if (!res.ok) throw new Error(body.error || "Something went wrong. Try again.");
  return body;
}

// The portal backend signs each upload for the logged-in editor (folder, allowed formats, a time limit),
// so nobody can put files into NLT's Cloudinary account without logging in.
async function uploadToCloudinary(file, onProgress) {
  if (MOCK) return new Promise((resolve) => { let p = 0; const t = setInterval(() => { p += 25; onProgress(Math.min(p, 100)); if (p >= 100) { clearInterval(t); resolve("https://res.cloudinary.com/os1vbtid/video/upload/v1/sample.mp4"); } }, 150); });
  const sig = await api("upload-signature");
  return new Promise((resolve, reject) => {
    const fd = new FormData();
    fd.append("file", file);
    fd.append("api_key", sig.apiKey);
    fd.append("timestamp", sig.timestamp);
    fd.append("folder", sig.folder);
    fd.append("allowed_formats", sig.allowedFormats);
    fd.append("signature", sig.signature);
    const xhr = new XMLHttpRequest();
    xhr.open("POST", `https://api.cloudinary.com/v1_1/${sig.cloudName}/video/upload`);
    xhr.upload.onprogress = (e) => { if (e.lengthComputable) onProgress(Math.round((e.loaded / e.total) * 100)); };
    xhr.onload = () => {
      if (xhr.status >= 200 && xhr.status < 300) {
        try { resolve(JSON.parse(xhr.responseText).secure_url); } catch { reject(new Error("Upload failed. Try again.")); }
      } else {
        let msg = "";
        try { msg = JSON.parse(xhr.responseText).error.message || ""; } catch { /* not JSON */ }
        reject(new Error(/format/i.test(msg) ? "That file type isn't allowed. Upload an MP4 or MOV video." : "Upload failed. Try again."));
      }
    };
    xhr.onerror = () => reject(new Error("Network error during upload. Try again."));
    xhr.send(fd);
  });
}

/* ---------- routing ---------- */
function go(hash) { if (location.hash !== hash) location.hash = hash; else render(); }
window.addEventListener("hashchange", render);

async function ensureData(force = false) {
  if (state.data && !force) return state.data;
  state.data = await api("dashboard");
  return state.data;
}

async function ensureQueue(force = false) {
  if (state.queue && !force) return state.queue;
  state.queue = (await api("review-queue")).videos;
  return state.queue;
}

async function render() {
  const h = location.hash || "#/";
  if (!store.token && !MOCK) {
    if (h === "#/code" && store.email) return renderCode();
    return renderLogin();
  }
  if (h === "#/login" || h === "#/code") { go("#/"); return; }
  // Team pages are only for people on the Reviewers list; the backend checks that on every team action too.
  if (isTeamRoute(h)) state.view = "team";
  else if (h !== "#/" && h !== "#") state.view = "editor";
  app.innerHTML = shell("", `<div class="loading">Loading…</div>`);
  try {
    await ensureData();
    if (isReviewer() && isTeamRoute(h)) await loadTeamFor(h);
  } catch (e) {
    if (!store.token && !MOCK) return;
    app.innerHTML = shell("", `<div class="loading">${esc(e.message)} <button class="linkbtn" data-act="retry">Try again</button></div>`);
    return;
  }
  if (isReviewer()) {
    if (h.startsWith("#/review/")) return renderReview(h.slice(9));
    if (h === "#/review") return renderQueue();
    if (h === "#/team") return renderTeam();
    if (h === "#/publish") return renderPublish();
    if (h.startsWith("#/publish/")) return renderSchedule(h.slice(10));
    if (h === "#/insights") return renderInsights();
    if (h === "#/team-templates") return renderTeamTemplates();
    if (h.startsWith("#/team-templates/")) return renderTemplateEdit(h.slice(17));
    if ((h === "#/" || h === "#") && state.view !== "editor") { go("#/team"); return; }
  }
  if (!isEditor()) { go("#/team"); return; }
  if (h.startsWith("#/video/")) return renderVideo(h.slice(8));
  if (h === "#/dashboard") return renderDashboard();
  if (h === "#/templates") return renderTemplates();
  if (h === "#/submit" || h.startsWith("#/submit/")) return renderSubmit(h.slice(9));
  if (h === "#/payments") return renderPayments();
  return renderDashboard();
}

/* ---------- shared pieces ---------- */
const LOGO_SVG = document.getElementById("logo-tpl").innerHTML;
const PHOTO = document.getElementById("photo-tpl").getAttribute("data-src");
const ARROW = `<svg aria-hidden="true" width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M10 3L5 8l5 5"/></svg>`;

const TEAM_KEYS = ["team", "review", "publish", "insights", "ttpl"];
function shell(active, inner) {

  const waiting = state.queue ? state.queue.filter((v) => v.status === "Submitted" || v.status === "In Review").length : teamData("overview")?.review?.count || 0;
  const nav = teamNav
    ? link("team", "#/team", "Today") + link("review", "#/review", "Review", waiting ? ` <span class="count">${waiting}</span>` : "") + link("publish", "#/publish", "Publish") + link("insights", "#/insights", "Insights") + link("ttpl", "#/team-templates", "Templates") + (isEditor() ? `<a href="#/dashboard">Editor view</a>` : "")
    : (isEditor() ? link("dash", isReviewer() ? "#/dashboard" : "#/", "Dashboard") + (templates().length ? link("tpl", "#/templates", "Templates") : "") + link("submit", "#/submit", 'Submit<span class="lg"> a video</span>') + link("pay", "#/payments", "Payments") : "") + (isReviewer() ? link("team", "#/team", "Team") : "");
  return `
  <header class="top"><div class="top-in">
    <a class="brand" href="${teamNav ? "#/team" : "#/"}" aria-label="No Limits Tour ${teamNav ? "team area" : "editor portal"}, home">${LOGO_SVG}<span class="sep"></span><span class="tag">${teamNav ? "Team" : "Editor portal"}</span></a>
    <nav class="main" aria-label="Main">
      ${nav}
      ${ed ? `<span class="who"><span class="avatar" aria-hidden="true">${esc(initials)}</span>${esc(ed.name)}</span>` : ""}
      <button class="linkbtn" style="color:var(--soft)" data-act="logout">Log out</button>
    </nav>
  </div></header>
  <main class="page">${inner}</main>`;
}

const STATUS = {
  "Submitted": ["Submitted", "b-sub"],
  "In Review": ["In review", "b-rev"],
  "Approved": ["Approved", "b-ok"],
  "Needs Resubmission": ["Needs changes", "b-fix"],
};
const statusBadge = (s) => { const [l, c] = STATUS[s] || [s, "b-sub"]; return `<span class="badge ${c}">${esc(l)}</span>`; };
const payBadge = (v) => v.paid || payoutOf(v)?.status === "Paid" ? `<span class="badge b-paid">Paid</span>` : payoutOf(v) ?`<span class="badge b-sending">Being paid</span>` : v.status === "Approved" || v.amount ? `<span class="badge b-unpaid">Not yet paid</span>` : "";

/* ---------- payouts ---------- */
// Which payout a video is in (built once per dashboard load).
let payoutIndex = { src: null, map: new Map() };
function payoutOf(v) {
  if (payoutIndex.src !== state.data) {
    const map = new Map();
    (state.data?.payouts || []).forEach((p) => (p.videoIds || []).forEach((id) => map.set(id, p)));
    payoutIndex = { src: state.data, map };
  }
  return payoutIndex.map.get(v.id) || null;
}
// A video earns money once it's approved, or when NLT has set a fixed amount for it.
const earns = (v) => v.status === "Approved" || Number(v.amount) > 0;
const fmtDate = (s) => { if (!s) return "–"; const d = parseDay(s); return `${DAYS[d.getDay()].slice(0, 3)} ${d.getDate()} ${MON[d.getMonth()]}`; };
const fmtFull = (s) => { if (!s) return "–"; const d = parseDay(s); return `${d.getDate()} ${MON[d.getMonth()]} ${d.getFullYear()}`; };
const nextPayday = () => state.data?.nextPayday || "";

/* ---------- dashboard ---------- */
function periodRows(videos) {
  const today = new Date();
  const first = videos.reduce((m, v) => (!m || (v.submitted && v.submitted < m) ? v.submitted : m), "") || iso(today);
  const rows = [];
  if (state.period === "week") {
    const start = weekStart(today);
    for (let i = 0; i < 8; i++) {
      const a = addDays(start, -7 * i), b = addDays(a, 6);
      const from = iso(a), to = iso(b);
      if (i > 0 && to < first) break;
      rows.push({ cur: i === 0, label: i === 0 ? "This week" : i === 1 ? "Last week" : fmtRange(a, b), sub: i < 2 ? fmtRange(a, b) : "", vids: videos.filter((v) => v.submitted >= from && v.submitted <= to) });
    }
  } else {
    for (let i = 0; i < 6; i++) {
      const d = new Date(today.getFullYear(), today.getMonth() - i, 1);
      const key = iso(d).slice(0, 7);
      if (i > 0 && key < first.slice(0, 7)) break;
      rows.push({ cur: i === 0, label: i === 0 ? "This month" : MONTHS[d.getMonth()], sub: i === 0 ? `${MONTHS[d.getMonth()]} ${d.getFullYear()}` : String(d.getFullYear()), vids: videos.filter((v) => (v.submitted || "").slice(0, 7) === key) });
    }
  }
  const max = Math.max(1, ...rows.map((r) => r.vids.length));
  return rows.map((r) => {
    const paid = sum(r.vids.filter((v) => v.paid)), owed = sum(r.vids.filter((v) => !v.paid));
    return `<div class="r">
      <div><div class="lab ${r.cur ? "cur" : ""}">${esc(r.label)}</div>${r.sub ? `<div class="small muted">${esc(r.sub)}</div>` : ""}</div>
      <div class="bar"><b>${r.vids.length}</b><span class="track"><span class="fill ${r.cur ? "cur" : ""}" style="display:block;width:${Math.round((r.vids.length / max) * 100)}%"></span></span></div>
      <div class="${paid ? "" : "zero"}">${money(paid)}</div>
      <div class="${owed ? "owe" : "zero"}">${money(owed)}</div>
    </div>`;
  }).join("");
}

const FILTERS = [
  ["all", "All", () => true],
  ["unpaid", "Not yet paid", (v) => !v.paid && earns(v)],
  ["paid", "Paid", (v) => v.paid],
  ["changes", "Needs changes", (v) => v.status === "Needs Resubmission"],
];

    <div class="badges d">${statusBadge(v.status)}${payBadge(v)}</div>
    <div class="amt">${amountCell(v)}</div>
  </a>`;
}

function renderDashboard() {

  const review = unpaid.filter((v) => !earns(v) && (v.status === "Submitted" || v.status === "In Review"));

  const changesUnpaid = unpaid.filter((v) => v.status === "Needs Resubmission");
  const total = Math.max(1, unpaid.length);
  const sumExpected = (list) => Math.round(list.reduce((t, v) => t + (Number(expected(v)) || 0), 0) * 100) / 100;
  const f = FILTERS.find((x) => x[0] === state.filter) || FILTERS[0];
  const list = videos.filter(f[2]);
  const ws = weekStart(today);
  const rateLine = editor.payModel === "Per Hour" ? `${money(editor.rate)} per hour` : `${money(editor.rate)} per approved video`;
  const rateNote = editor.payModel === "Per Hour" ? "" : ", including one round of feedback and the caption";
  const tplNote = templates().some((t) => t.pay != null) ? " Videos made from a template pay the template's price." : "";
  const openTpl = templates().filter((t) => !t.full);

  app.innerHTML = shell("dash", `
    <div class="hero">
      <div>
        <div class="eyebrow">${DAYS[today.getDay()]} ${today.getDate()} ${MONTHS[today.getMonth()]}</div>
        <h1 class="head">Hi, ${esc(editor.firstName)}</h1>
        <p>You're paid <strong style="color:#fff">${rateLine}</strong>${rateNote}.${tplNote} Here's what you've submitted and what's been paid.</p>
      </div>
      <div style="display:flex;flex-wrap:wrap;gap:12px">
        ${openTpl.length ? `<a class="btn ghost" href="#/templates" style="min-height:48px">${plural(openTpl.length, "template", "templates")} to make</a>` : ""}
        <a class="btn" href="#/submit">Submit a video</a>
      </div>
    </div>

    <section class="tiles" aria-label="Summary">
      <div class="tile"><div class="lbl">This week</div><div class="num">${thisWeek.length}</div><div class="sub">${thisWeek.length === 1 ? "video" : "videos"} · ${fmtRange(ws, addDays(ws, 6))}</div></div>
      <div class="tile"><div class="lbl">This month</div><div class="num">${thisMonth.length}</div><div class="sub">${thisMonth.length === 1 ? "video" : "videos"} in ${MONTHS[today.getMonth()]}</div></div>
      <div class="tile paid"><div class="lbl">Paid</div><div class="num">${money(sum(paid))}</div><div class="sub">${plural(paid.length, "video", "videos")}</div></div>
      <div class="tile owed"><div class="lbl">Not yet paid</div><div class="num">${money(sum(approved))}</div><div class="sub">${plural(approved.length, "approved video", "approved videos")}</div></div>
    </section>

    <div class="row">
      <section class="card grow" aria-label="Your output">
        <div class="card-head">
          <h2>Your output</h2>
          <div class="seg" role="group" aria-label="Period">
            <button data-act="period" data-v="week" class="${state.period === "week" ? "on" : ""}" aria-pressed="${state.period === "week"}">Weekly</button>
            <button data-act="period" data-v="month" class="${state.period === "month" ? "on" : ""}" aria-pressed="${state.period === "month"}">Monthly</button>
          </div>
        </div>
        <div class="ptable">

        <p class="small muted" style="margin:14px 0 0">${state.period === "week" ? "Weeks run Monday to Sunday. A video counts in the week you submitted it." : "A video counts in the month you submitted it."} Amounts only include approved videos.</p>
      </section>

      <div class="side">
        ${changes.length ? `<section class="card attn" aria-label="Needs changes">
          <div class="card-head" style="margin-bottom:8px"><h2 style="font-size:16px">Needs changes</h2><span class="small muted">${plural(changes.length, "video", "videos")}</span></div>
          ${changes.slice(0, 3).map((v) => `<a class="attn-item" href="#/video/${esc(v.id)}">
            ${thumbUrl(v.videoUrl) ? `<img class="thumb" src="${esc(thumbUrl(v.videoUrl))}" alt="">` : `<span class="thumb"></span>`}
            <div style="min-width:0"><div class="vt">${esc(v.title)}</div><div class="small muted">Submitted ${esc(dayLabel(v.submitted))}</div>

        <section class="card" aria-label="Not yet paid">
          <div style="display:flex;align-items:baseline;justify-content:space-between;gap:10px"><h2 style="font-size:16px">Not yet paid</h2><span class="head" style="font-size:22px;color:var(--orange)">${money(sum(approved))}</span></div>
          <div class="split-bar" aria-hidden="true">

            <div><span class="dot" style="background:var(--orange)"></span><span style="flex:1">In review</span><span class="muted">${plural(review.length, "video", "videos")}</span><b class="pending" style="width:56px;text-align:right">${money(sumExpected(review))}</b></div>
            <div><span class="dot" style="background:var(--salmon)"></span><span style="flex:1">Needs changes</span><span class="muted">${plural(changesUnpaid.length, "video", "videos")}</span><b class="pending" style="width:56px;text-align:right">${money(sumExpected(changesUnpaid))}</b></div>
          </div>
          <p class="small muted" style="margin:16px 0 0">Only approved videos are paid. Grey amounts are what a video earns once it's approved. Approved videos are paid every second Friday, in pesos.</p>
          ${nextPayday() ? `<div style="display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:8px;margin-top:14px;padding-top:14px;border-top:1px solid rgba(255,255,255,0.1)"><span>Next payday <b>${esc(fmtDate(nextPayday()))}</b></span><a href="#/payments" class="small">See your payments</a></div>` : ""}

    <section class="card" aria-label="Your videos">
      <div class="card-head" style="margin-bottom:10px">
        <h2>Your videos</h2>
        <div class="chips" role="group" aria-label="Filter videos">
          ${FILTERS.filter((x) => x[0] !== "changes" || changes.length).map((x) => `<button class="chip-btn ${state.filter === x[0] ? "on" : ""}" data-act="filter" data-v="${x[0]}" aria-pressed="${state.filter === x[0]}">${x[1]}<span>${videos.filter(x[2]).length}</span></button>`).join("")}

}

/* ---------- payments page ---------- */
const CHEV = `<svg aria-hidden="true" width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3l5 5-5 5"/></svg>`;

function payoutRow(p, byId) {
  const vids = (p.videoIds || []).map((id) => byId.get(id)).filter(Boolean);
  const paid = p.status === "Paid";
  const badge = paid ? `<span class="badge b-paid">Paid ${esc(dayLabel(p.paidOn || p.payDate))}</span>` : `<span class="badge b-sending">Being sent</span>`;
  const rateTxt = p.rate ? `1 USD = ${Number(p.rate).toFixed(2)} PHP` : "Set on payday";
  return `<details class="payout">
    <summary>
      <span class="chev">${CHEV}</span>
      <span class="pd"><b>Payday ${esc(fmtFull(p.payDate))}</b><span class="small muted">${plural(p.videoIds.length, "video", "videos")}${p.paidTo ? ` · to ${esc(p.paidTo)}` : ""}</span></span>
      ${badge}
      <span class="usd">${usd2(p.usd)}</span>
      <span class="php" style="color:${paid ? "var(--green)" : "var(--orange)"}">${p.php ? peso(p.php) : "₱ –"}</span>
    </summary>
    <div class="pbody">
      <div class="facts">
        <div><div class="kv">Earned</div><div class="v">${usd2(p.usd)}</div></div>
        <div><div class="kv">Exchange rate</div><div class="v">${esc(rateTxt)}</div>${p.rateSource ? `<div class="small muted">${esc(p.rateSource)}</div>` : ""}</div>
        <div><div class="kv">${paid ? "You got" : "You'll get"}</div><div class="v">${p.php ? peso(p.php) : "–"}</div>${p.paidTo ? `<div class="small muted">to ${esc(p.paidTo)}</div>` : ""}</div>
        <div><div class="kv">${paid ? "Sent" : "Status"}</div><div class="v">${paid ? esc(fmtFull(p.paidOn || p.payDate)) : "Being sent by Wise"}</div>${(p.receipts || []).map((r) => `<div class="small"><a href="${esc(r.url)}" target="_blank" rel="noopener">${esc(r.name || "Wise receipt")}</a></div>`).join("")}</div>
      </div>
      ${p.note ? `<div class="quote" style="margin:0"><b style="color:var(--orange-soft)">Note from NLT</b>${esc(p.note)}</div>` : ""}
      <div class="vlist">
        ${vids.map((v) => `<a class="li" href="#/video/${esc(v.id)}"><span>${esc(v.title || "(untitled)")}</span><span>${usd2(v.amount)}</span></a>`).join("")}
        ${vids.length !== p.videoIds.length ? `<div class="li"><span class="muted">${plural(p.videoIds.length - vids.length, "other video", "other videos")}</span><span></span></div>` : ""}
        <div class="li tot"><span>Total</span><span>${usd2(p.usd)}${p.php ? ` → ${peso(p.php)}` : ""}</span></div>
      </div>
    </div>
  </details>`;
}

function renderPayments() {
  const { videos, payouts = [] } = state.data;
  const byId = new Map(videos.map((v) => [v.id, v]));
  const waiting = videos.filter((v) => !v.paid && !payoutOf(v) && Number(v.amount) > 0)
    .sort((a, b) => (a.submitted || "").localeCompare(b.submitted || ""));
  const sending = payouts.filter((p) => p.status !== "Paid");
  const done = payouts.filter((p) => p.status === "Paid");
  const paidPhp = done.reduce((t, p) => t + (Number(p.php) || 0), 0);
  const paidUsd = Math.round(done.reduce((t, p) => t + (Number(p.usd) || 0), 0) * 100) / 100;
  const nd = nextPayday();
  const t0 = new Date(); t0.setHours(0, 0, 0, 0);
  const inDays = nd ? Math.round((parseDay(nd) - t0) / 86400000) : 0;
  const when = !nd ? "" : inDays <= 0 ? "Today" : inDays === 1 ? "Tomorrow" : `In ${inDays} days`;

  app.innerHTML = shell("pay", `
    <div class="hero">
      <div>
        <div class="eyebrow">Payments</div>
        <h1 class="head">Your payments</h1>
        <p>You're paid every second Friday for everything approved since the last payday. We add it up in US dollars, convert it to Philippine pesos at that day's rate and send the pesos by Wise.</p>
      </div>
    </div>

    <section class="tiles" aria-label="Payment summary">
      <div class="tile"><div class="lbl">Next payday</div><div class="num date">${esc(nd ? fmtDate(nd) : "–")}</div><div class="sub">${esc(when)}</div></div>
      <div class="tile owed"><div class="lbl">For the next payday</div><div class="num">${money(sum(waiting))}</div><div class="sub">${plural(waiting.length, "approved video", "approved videos")}</div></div>
      <div class="tile paid"><div class="lbl">Paid so far</div><div class="num">${peso(paidPhp)}</div><div class="sub">${usd2(paidUsd)} · ${plural(done.length, "payout", "payouts")}</div></div>
    </section>

    ${sending.map((p) => `<section class="card onway" aria-label="Payout being sent">
      <div><div class="eyebrow" style="margin-bottom:4px">On its way</div><div style="font-size:16px">Your payout of ${esc(fmtFull(p.payDate))} is being sent${p.paidTo ? ` to <b>${esc(p.paidTo)}</b>` : ""}. It shows as Paid here once it's sent.</div></div>
      <div class="head" style="font-size:30px;color:var(--orange)">${p.php ? peso(p.php) : usd2(p.usd)}</div>
    </section>`).join("")}

    <div class="row">
      <section class="card grow" aria-label="Payouts">
        <div class="card-head" style="margin-bottom:6px"><h2>Payouts</h2><span class="small muted">Open one to see the videos, the rate and the receipt.</span></div>
        ${payouts.length ? payouts.map((p) => payoutRow(p, byId)).join("") : `<div class="empty">No payouts yet. Your first one comes on ${esc(nd ? fmtDate(nd) : "the next payday")}.</div>`}
      </section>

      <div class="side">
        <section class="card" aria-label="Next payout">
          <div style="display:flex;align-items:baseline;justify-content:space-between;gap:10px"><div><h2 style="font-size:16px">Next payout</h2>${nd ? `<div class="small muted">${esc(fmtDate(nd))}</div>` : ""}</div><span class="head" style="font-size:22px;color:var(--orange)">${money(sum(waiting))}</span></div>
          ${waiting.length ? `<div class="vlist" style="margin-top:12px">${waiting.map((v) => `<a class="li" href="#/video/${esc(v.id)}"><span>${esc(v.title || "(untitled)")}</span><span>${usd2(v.amount)}</span></a>`).join("")}</div>`
            : `<p class="small muted" style="margin:12px 0 0">Nothing approved since the last payday yet.</p>`}
          <p class="small muted" style="margin:14px 0 0">Anything approved before the payday goes in. It's converted to pesos at the rate on payday.</p>
        </section>
        <section class="card" aria-label="How payment works">
          <h2 style="font-size:16px;margin-bottom:14px">How payment works</h2>
          <ol class="how">
            <li>NLT approves your video. It earns your rate.</li>
            <li>Every second Friday, everything approved since the last payday goes into one payout, converted from US dollars to pesos at that day's rate.</li>
            <li>We send the pesos by Wise and mark the payout Paid here, with the receipt when there is one.</li>
          </ol>
        </section>
      </div>
    </div>`);
}

/* ---------- video page ---------- */
function payLine(v) {
  const p = payoutOf(v);
  if (v.paid || p?.status === "Paid") return p ? `Paid on ${esc(fmtFull(p.paidOn || p.payDate))} in your <a href="#/payments">${esc(p.php ? peso(p.php) : usd2(p.usd))} payout</a>.` : "This video has been paid.";
  if (p) return `It's in your payout of ${esc(fmtFull(p.payDate))}, which is being sent now. <a href="#/payments">See payments</a>`;
  return nextPayday() ? `It goes into your next payout on ${esc(fmtDate(nextPayday()))}.` : "It goes into your next payout.";
}

function steps(v) {
  const p = payoutOf(v);
  const paidOut = v.paid || p?.status === "Paid";
  const fix = !paidOut && v.status === "Needs Resubmission";
  const reviewing = !paidOut && !earns(v) && (v.status === "Submitted" || v.status === "In Review");
  const approved = paidOut || earns(v);
  const s = [
    { cls: "done", t: "Submitted", d: dayLabel(v.submitted) },
    fix ? { cls: "fix", t: "Changes requested", d: v.reviewed ? dayLabel(v.reviewed) : "", icon: "!" }
      : reviewing ? { cls: "now", t: v.status === "In Review" ? "In review" : "Waiting for review", d: "" }
      : { cls: "done", t: "Reviewed", d: v.reviewed ? dayLabel(v.reviewed) : "" },
    approved ? { cls: paidOut || p ? "done" : "now", t: "Approved", d: v.reviewed ? dayLabel(v.reviewed) : "" } : { cls: "todo", t: "Approved", d: "Next" },
    paidOut ? { cls: "done", t: "Paid", d: p ? dayLabel(p.paidOn || p.payDate) : "" }
      : p ? { cls: "now", t: "Being paid", d: `Payday ${dayLabel(p.payDate)}` }
      : { cls: "todo", t: "Paid", d: approved && nextPayday() ? `Payday ${fmtDate(nextPayday())}` : "After approval" },
  ];
  const check = `<svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7.5l2.6 2.6L11 4.5"/></svg>`;
  return `<ol class="steps" aria-label="Progress">${s.map((x) => `<li class="${x.cls}" ${x.cls === "now" || x.cls === "fix" ? 'aria-current="step"' : ""}>
    <div class="mk"><span class="c">${x.cls === "done" ? check : x.icon || ""}</span><span class="ln"></span></div>
    <div><div class="t">${esc(x.t)}</div><div class="small muted">${esc(x.d)}</div></div></li>`).join("")}</ol>`;
}

function renderVideo(id) {
  const v = state.data.videos.find((x) => x.id === id);
  if (!v) { app.innerHTML = shell("", `<a class="back" href="#/">${ARROW} Back to dashboard</a><div class="empty">That video isn't in your list.</div>`); return; }
  const fix = v.status === "Needs Resubmission";
  const poster = thumbUrl(v.videoUrl, 540, 960);
  let statusCard = "";
  if (fix) {
    statusCard = `<section class="card attn" aria-label="Feedback">
      <h2 style="font-size:18px">Feedback from NLT</h2>
      <div class="pre" style="margin-top:12px">${esc(v.feedback || "We need a few changes. Check with the team for details.")}</div>
    </section>
    <section class="card" aria-label="Upload a new version" id="reupload">
      <h2 style="font-size:18px;margin-bottom:16px">Upload a new version</h2>
      <div style="display:flex;flex-direction:column;gap:16px">
        <div id="reDrop">${dropzone("reFile")}</div>
        <div class="field"><label for="reCaption">Caption <span class="req">Required</span></label><textarea class="input" id="reCaption" rows="4" required spellcheck="true" lang="en-US">${esc(v.caption)}</textarea><div class="check-row"><span></span><button type="button" class="btn ghost" data-act="checkCaption" data-for="reCaption">Check spelling and tone</button></div><div id="reCaptionCheck"></div></div>
        <div class="field"><label for="reMusic">Music <span class="req">Required</span></label><input class="input" id="reMusic" type="url" required placeholder="https://artlist.io/..." value="${esc(v.music)}"><span class="hint">Paste the Artlist link of the track you used.</span></div>
        <div style="display:flex;flex-wrap:wrap;align-items:center;gap:14px">
          <button class="btn" data-act="resubmit" data-id="${esc(v.id)}" id="reBtn" disabled>Submit new version</button>
          <span class="small muted" id="reHint">Add the new file first.</span>
        </div>
        <div class="error hidden" id="reError" role="alert"></div>
      </div>
      <p class="small muted" style="margin:16px 0 0">The new version replaces this one in the same row. Your rate per video includes one round of feedback.</p>
    </section>`;
  } else if (earns(v) || v.paid) {
    const when = v.publishAt ? new Date(v.publishAt) : null;
    statusCard = `<section class="card" aria-label="Approved" style="box-shadow:inset 0 0 0 1px rgba(99,217,154,0.6)">
      <div style="display:flex;justify-content:space-between;align-items:baseline;gap:10px"><h2 style="font-size:18px;color:var(--green)">${v.paid || payoutOf(v)?.status === "Paid" ? "Approved and paid" : "Approved"}</h2><span class="head" style="font-size:24px">${money(v.amount)}</span></div>
      <p style="margin:8px 0 0;color:#E3EAE8">${payLine(v)}${v.posted ? " It's been posted." : when ? ` It's scheduled to go out on ${DAYS[when.getDay()]} ${when.getDate()} ${MON[when.getMonth()]}.` : ""}</p>
      ${v.feedback ? `<div class="quote" style="margin-top:14px"><b style="color:var(--green)">Note from NLT</b>${esc(v.feedback)}</div>` : ""}
    </section>`;
  } else {
    statusCard = `<section class="card" aria-label="Review status" style="box-shadow:inset 0 0 0 1px rgba(240,120,29,0.5)">
      <h2 style="font-size:18px">We're reviewing it</h2>
      <p style="margin:8px 0 0;color:#E3EAE8">Your video is with the NLT team. If anything needs changing, you'll see the feedback here.</p>
    </section>`;
  }
  app.innerHTML = shell("", `
    <div style="display:flex;flex-direction:column;gap:10px" class="vhead">
      <a class="back" href="#/">${ARROW} Back to dashboard</a>
      <div class="line"><h1 class="head">${esc(v.title || "(untitled)")}</h1>${statusBadge(v.status)}${payBadge(v)}</div>
      <div class="small muted">Submitted ${esc(dayLabel(v.submitted))} · ${v.status === "Approved" || v.amount ? money(v.amount) : `${money(expected(v))} once approved`}</div>
    </div>
    ${steps(v)}
    <div class="row">
      <div class="player">
        ${v.videoUrl ? `<video controls playsinline preload="metadata" src="${esc(v.videoUrl)}" ${poster ? `poster="${esc(poster)}"` : ""}></video>` : `<div class="ph">No video file on this one.</div>`}
      </div>
      <div class="grow" style="display:flex;flex-direction:column;gap:20px;flex-basis:480px">
        ${statusCard}
        <section class="card" aria-label="What you submitted" style="display:flex;flex-direction:column;gap:16px">
          <h2 style="font-size:18px">What you submitted</h2>
          ${v.template ? `<div><div class="kv">Template</div><a href="#/templates">${esc(v.template.name)}</a></div>` : ""}
          <div><div class="kv">Caption</div><div class="pre">${esc(v.caption || "No caption")}</div></div>
          <div><div class="kv">Music</div>${v.music ? `<a href="${esc(v.music)}" target="_blank" rel="noopener">${esc(v.music.replace(/^https?:\/\//, "").slice(0, 60))}</a>` : `<span class="muted">Not added</span>`}</div>
        </section>
      </div>
    </div>`);
}

/* ---------- templates ---------- */
function templateCard(t) {
  const left = t.open == null ? "" : t.full ? "Full for now" : `${plural(t.open, "video", "videos")} still needed`;
  const part = (label, txt) => (txt ? `<div><div class="kv">${label}</div><div class="pre">${esc(txt)}</div></div>` : "");
  return `<section class="card tcard${t.full ? " full" : ""}" aria-label="${esc(t.name)}">
    <div class="top">
      <div style="min-width:0">
        <h2 style="font-size:20px;line-height:1.2">${esc(t.name)}</h2>
        <div class="meta">${levelBadge(t.level)}${t.live === false ? `<span class="badge b-sub" title="Only the NLT team sees this template until it goes live">Team only · testing</span>` : ""}${left ?`<span class="${t.full ? "muted" : "owe"}">${esc(left)}</span>` : ""}</div>
      </div>
      <div class="price"><b>${money(payFor(t))}</b><span class="small muted">per approved video</span></div>
    </div>
    ${t.example ? `<a class="btn ghost" href="${esc(t.example)}" target="_blank" rel="noopener" style="align-self:flex-start">Watch the example</a>` : ""}
    ${part("How to build it", t.brief)}
    ${part("Text on screen", t.textOnScreen)}
    ${part("Caption", t.caption)}
    ${part("Music", t.music)}
    <div class="foot">${t.full ? `<span class="small muted">We have enough of these for now. Pick another template.</span>` : `<a class="btn" href="#/submit/${esc(t.id)}">Use this template</a>`}</div>
  </section>`;
}

function renderTemplates() {
  const list = templates();
  app.innerHTML = shell("tpl", `
    <div class="hero">
      <div>
        <div class="eyebrow">What to make</div>
        <h1 class="head">Templates</h1>
        <p>Video formats that work for NLT. Watch the example, follow the brief, and pick the template when you submit. You can make the same template for several athletes in one go.</p>
      </div>
    </div>
    ${list.length ? `<div class="tgrid">${list.map(templateCard).join("")}</div>`
      : `<section class="card"><div class="empty" style="padding:4px 0">No templates right now. <a href="#/submit">Submit your own idea</a>.</div></section>`}`);
}

function tplHint(id) {
  const t = templates().find((x) => x.id === id);
  if (t) return `Pays ${money(payFor(t))} once approved.${t.example ? ` <a href="${esc(t.example)}" target="_blank" rel="noopener">Watch the example</a> ·` : ""} <a href="#/templates">Read the brief</a>`;
  if (id === "own") return `Your own idea pays your rate, ${money(ownRate())}, once approved.`;
  return `Not sure which one? <a href="#/templates">See the templates</a>.`;
}

function templatePicker(pre) {
  const list = templates();
  if (!list.length) return "";
  const sel = list.some((t) => t.id === pre && !t.full) || pre === "own" ? pre : "";
  const opt = (t) => `<option value="${esc(t.id)}"${t.id === sel ? " selected" : ""}${t.full ? " disabled" : ""}>${esc(t.name)}${t.level ? ` · ${esc(t.level)}` : ""} · ${money(payFor(t))}${t.live === false ? " · team only" : ""}${t.full ? " · full" : ""}</option>`;
  return `<div class="field">
    <label for="tpl">Template <span class="req">Required</span></label>
    <select class="input" id="tpl" required>
      <option value=""${sel ? "" : " selected"} disabled>Choose the template you used</option>
      ${list.map(opt).join("")}
      <option value="own"${sel === "own" ? " selected" : ""}>Own idea · ${money(ownRate())}</option>
    </select>
    <span class="hint" id="tplHint">${tplHint(sel)}</span>
  </div>`;
}

/* ---------- submit page ---------- */
function dropzone(inputId) {
  return `<label class="drop" for="${inputId}">
    <svg aria-hidden="true" width="28" height="28" viewBox="0 0 28 28" fill="none" stroke="#F0781D" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 18V6M9 11l5-5 5 5M5 20v2h18v-2"/></svg>
    <span class="big">Choose the video file</span>
    <span class="hint">It uploads straight away. Big files take a few minutes.</span>
    <input type="file" id="${inputId}" accept="video/*">

function addNote() {
  const id = location.hash.slice(9);
  const d = draftFor(id);
  const tIn = document.getElementById("nTime"), xIn = document.getElementById("nText");
  const text = xIn.value.trim();
  if (!text) { xIn.focus(); return; }
  const sec = seconds(tIn.value);
  d.notes.push({ time: sec === null ? tIn.value.trim() || "0:00" : clock(sec), text });
  d.notes.sort((a, b) => (seconds(a.time) ?? 0) - (seconds(b.time) ?? 0));
  xIn.value = "";
  document.getElementById("rvError")?.classList.add("hidden");
  document.getElementById("noteList").innerHTML = noteList(d);
  xIn.focus();
}

const TEAM_ROUTES = ["#/team", "#/publish", "#/insights", "#/team-templates"];

const ALL_CHANNELS = ["Instagram", "Facebook", "TikTok", "YouTube"];
const NETS = [["all", "All"], ["instagram", "Instagram"], ["facebook", "Facebook"], ["tiktok", "TikTok"], ["youtube", "YouTube"]];
const netName = (k) => NETS.find((n) => n[0] === k)?.[1] || k;
const signed = (n) => (n === null || n === undefined ? "–" : `${n > 0 ? "+" : n < 0 ? "−" : ""}${Math.abs(Math.round(n)).toLocaleString("en-US")}`);
const TRIALS = [["", "Normal reel"], ["Auto-share if it performs", "Trial reel, shared with followers if it does well"], ["Manual (share in Instagram)", "Trial reel, we share it by hand in Instagram"]];
const LEVEL_INFO = [["Simple", "One shot, one angle."], ["Medium", "Two or three angles."], ["Advanced", "Four or more angles, or a story."]];
const nf = (n) => (n === null || n === undefined || n === "" || !Number.isFinite(Number(n)) ? "–" : Math.round(Number(n)).toLocaleString("en-US"));
const kfmt = (n) => { const v = Number(n) || 0; return v >= 10000 ? `${Math.round(v / 1000)}k` : v >= 1000 ? `${(v / 1000).toFixed(1).replace(/\.0$/, "")}k` : String(Math.round(v)); };
const clipText = (s, n) => { const t = String(s || ""); return t.length > n ? t.slice(0, n - 1).trimEnd() + "…" : t; };
const toMin = (t) => { const [h, m] = String(t || "0:0").split(":").map(Number); return (h || 0) * 60 + (m || 0); };
function viennaNow() {
  const p = new Intl.DateTimeFormat("en-GB", { timeZone: "Europe/Vienna", hourCycle: "h23", year: "numeric", month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit" }).formatToParts(new Date());
  const g = (t) => p.find((x) => x.type === t)?.value ?? "00";
  return { date: `${g("year")}-${g("month")}-${g("day")}`, time: `${g("hour")}:${g("minute")}` };
}
const viennaStamp = (ts) => (ts ? new Intl.DateTimeFormat("en-GB", { timeZone: "Europe/Vienna", day: "numeric", month: "short", hour: "2-digit", minute: "2-digit", hourCycle: "h23" }).format(new Date(ts)) : "");
const athleteNames = (x) => (x?.athletes || []).map((a) => (typeof a === "string" ? a : a?.name)).filter(Boolean);
function miniTags(x) {
  const a = athleteNames(x).map((n) => `<span class="mini">${esc(n)}</span>`).join("");
  const t = x?.template ? `<span class="mini tpl">${esc(x.template.name)}</span>` : "";
  return a || t ? `<div class="tag-row">${a}${t}</div>` : "";
}
// The feed should keep changing: the same athlete or the same template twice in a row reads as a repeat.
function flowIssue(a, b) {
  if (!a || !b) return "";
  const shared = athleteNames(a).filter((n) => athleteNames(b).includes(n));
  if (shared.length) return `${shared[0]} twice in a row`;
  if (a.template && b.template && a.template.id === b.template.id) return `${a.template.name} twice in a row`;
  return "";
}

// Team data, kept for a minute (Insights for ten) so moving between pages stays quick.
const TEAM_TTL = { overview: 60_000, pub: 60_000, tpl: 60_000, ins: 10 * 60_000 };
const teamCache = () => (state.team = state.team || {});
const teamData = (key) => teamCache()[key]?.data;
const teamDrop = (...keys) => { const c = teamCache(); keys.forEach((k) => delete c[k]); };
async function teamGet(key, action, payload = {}, force = false) {
  const c = teamCache();
  const ttl = TEAM_TTL[key.split(":")[0]] || 60_000;
  if (!force && c[key] && Date.now() - c[key].at < ttl) return c[key].data;
  const data = await api(action, payload);
  c[key] = { at: Date.now(), data };
  return data;
}
function loadTeamFor(h) {
  if (h.startsWith("#/review")) return ensureQueue();
  if (h === "#/team") return teamGet("overview", "team-overview");
  if (h.startsWith("#/publish")) return teamGet("pub", "publish-queue");
  if (h.startsWith("#/team-templates")) return teamGet("tpl", "team-templates");
  if (h === "#/insights") return teamGet("ins:" + state.channel, "insights", { channel: state.channel });
}

/* --- Publish --- */
const next7 = (today) => Array.from({ length: 7 }, (_, i) => iso(addDays(parseDay(today), i)));
const slotKey = (e) => `${e.date} ${e.time}`;
// Free standard slots in the next 7 days, at least half an hour from now.
function freeSlots(d) {
  const now = viennaNow();
  const taken = new Set(d.scheduled.filter((x) => x.publishAt).map((x) => `${x.publishAt.date} ${x.publishAt.time}`));
  const out = [];
  for (const day of next7(d.today)) for (const t of d.slots) {
    if (taken.has(`${day} ${t}`)) continue;
    if (day < now.date || (day === now.date && toMin(t) < toMin(now.time) + 30)) continue;
    out.push({ date: day, time: t });
  }
  return out;
}
const fixedTimeline = (d) => d.scheduled.filter((x) => x.publishAt).map((x) => ({ date: x.publishAt.date, time: x.publishAt.time, item: x, kind: "scheduled" }));
const timeline = (d) => [...fixedTimeline(d), ...(state.plan || [])].sort((a, b) => slotKey(a).localeCompare(slotKey(b)));
const plannable = (x) => x.status !== "Failed" && !x.sending && String(x.caption || "").trim() && x.videoUrl;

// Oldest ready videos first, into the free slots, skipping a video that would repeat the post before or after.
function makePlan(d) {
  const pool = d.ready.filter(plannable);
  const fixed = fixedTimeline(d);
  const plan = [];
  for (const s of freeSlots(d)) {
    if (!pool.length) break;
    const all = [...fixed, ...plan].sort((a, b) => slotKey(a).localeCompare(slotKey(b)));
    const before = all.filter((e) => slotKey(e) < slotKey(s)).pop()?.item;
    const after = fixed.find((e) => slotKey(e) > slotKey(s))?.item;
    let i = pool.findIndex((x) => !flowIssue(before, x) && !flowIssue(x, after));
    if (i < 0) i = 0;
    plan.push({ ...s, item: pool.splice(i, 1)[0], kind: "plan" });
  }
  return plan;
}

function renderPublish() {
  const d = teamData("pub");
  const now = viennaNow();
  const tl = timeline(d);
  const planKeys = new Set((state.plan || []).map(slotKey));
  const freeLeft = freeSlots(d).filter((s) => !planKeys.has(slotKey(s)));
  const canPlan = freeLeft.length && d.ready.some(plannable);
  const slotHtml = (e, prev) => {
    if (e.kind === "free") return `<div class="slot free"><span class="st">${esc(e.time)}</span> free</div>`;
    const issue = flowIssue(prev?.item, e.item);
    const body = `<div class="st">${esc(e.time)}${e.kind === "plan" ? ` <span style="color:var(--orange-soft);font-weight:400">plan</span>` : ""}</div><div class="sv">${esc(clipText(e.item.title, 64))}</div>${miniTags(e.item)}${issue ? `<div class="flow-warn">${esc(issue)}</div>` : ""}`;
    return `<div class="slot ${e.kind === "plan" ? "plan" : ""} ${issue ? "clash" : ""}">${body}</div>`;
  };
  const days = next7(d.today).map((day) => {
    const all = [...tl.filter((e) => e.date === day), ...freeLeft.filter((s) => s.date === day).map((s) => ({ ...s, kind: "free" }))]
      .sort((a, b) => a.time.localeCompare(b.time));
    return `<div class="day7 ${day === now.date ? "today" : ""}"><div class="dh">${day === now.date ? "Today" : esc(fmtDate(day))}</div>
      ${all.map((e) => slotHtml(e, e.kind === "free" ? null : tl[tl.indexOf(e) - 1])).join("") || `<div class="small muted">–</div>`}</div>`;
  }).join("");
  const n = (state.plan || []).length;
  const planBar = state.planRunning
    ? `<span class="small" id="planStatus" role="status">Scheduling…</span>`

  const statusOf = (x) => x.sending ? `<span class="badge b-sending">Sending to Publer</span>`

  const readyRows = d.ready.map((x) => {

  app.innerHTML = shell("publish", `

async function runPlan() {
  const plan = state.plan || [];
  if (!plan.length) return;
  state.planRunning = true;
  renderPublish();
  const say = (t) => { const el = document.getElementById("planStatus"); if (el) el.textContent = t; };
  const failed = [];
  for (let i = 0; i < plan.length; i++) {
    const p = plan[i], x = p.item;
    say(`Scheduling ${i + 1} of ${plan.length}: ${clipText(x.title, 40)}`);
    try {
      await api("publish-schedule", { id: x.id, caption: x.caption, channels: x.channels.length ? x.channels : ALL_CHANNELS, date: p.date, time: p.time, extra: x.extra, trial: x.trial });
    } catch (err) { failed.push(`${clipText(x.title, 40)}: ${err.message}`); }
    // One at a time, so the Airtable automation and Publer keep up.
    if (i < plan.length - 1) await new Promise((r) => setTimeout(r, MOCK ? 300 : 15000));
  }
  state.plan = null; state.planRunning = false;
  teamDrop("pub", "overview");
  toast(failed.length ? `${plan.length - failed.length} scheduled. Not sent: ${failed.join("; ")}` : `${plural(plan.length, "video", "videos")} scheduled. Publer gets them in a minute or two.`);
  if (location.hash === "#/publish") render();
}

// Shows the post before and after the chosen time, and warns when the feed would repeat itself.
function updateFlow() {
  const el = document.getElementById("flowNote");
  const d = teamData("pub"), s = state.sched;
  if (!el || !d || !s) return;
  if (document.getElementById("pubDraft")?.checked) { el.innerHTML = ""; return; }
  const date = document.getElementById("pubDate").value, time = document.getElementById("pubTime").value;
  if (!date || !time) { el.innerHTML = ""; return; }
  const k = `${date} ${time}`;
  const x = [...d.ready, ...d.scheduled].find((v) => v.id === s.id);
  const ath = new Map(d.athletes.map((a) => [a.id, a]));
  (x?.athletes || []).forEach((a) => { if (!ath.has(a.id)) ath.set(a.id, a); });
  const cur = { ...x, athletes: s.athletes.map((id) => ath.get(id)).filter(Boolean) };
  const tl = timeline(d).filter((e) => e.item.id !== s.id);
  const before = tl.filter((e) => slotKey(e) < k).pop(), after = tl.find((e) => slotKey(e) > k), same = tl.find((e) => slotKey(e) === k);
  const line = (label, e) => `<span class="muted">${label}: ${esc(fmtDate(e.date))} ${esc(e.time)} · ${esc(clipText(e.item.title, 56))}</span>`;
  el.innerHTML = [
    same ? `<span class="flow-warn">${esc(clipText(same.item.title, 56))} is already at this time.</span>` : "",
    before ? line("Before", before) : "",
    after ? line("After", after) : "",
    ...[flowIssue(before?.item, cur), flowIssue(cur, after?.item)].filter(Boolean).map((t) => `<span class="flow-warn">${esc(t)}</span>`),
  ].filter(Boolean).join("");
}

/* --- Insights --- */
function barChart(points, unit) {
  const vals = points.map((p) => Number(p.value) || 0);
  const max = Math.max(1, ...vals);
  let best = -1, lastFull = -1;
  points.forEach((p, i) => { if (!p.current && p.value != null) { lastFull = i; if (best < 0 || vals[i] > vals[best]) best = i; } });
  const bars = points.map((p, i) => {
    const h = p.value ? Math.max(2, Math.round((vals[i] / max) * 100)) : 0;
    const tip = p.value == null ? `${p.long}: no videos` : `${p.long}: typical video ${nf(p.value)} ${unit} · ${plural(p.posts, "video", "videos")}${p.current ? " · still collecting views" : ""}`;
    return `<div class="bar ${p.current ? "cur" : ""} ${i === best ? "best" : ""}" tabindex="0" role="img" aria-label="${esc(tip)}" data-tip="${esc(tip)}">
      ${h ? `<div class="b" style="height:${h}%"></div>` : ""}
      ${h && (i === best || i === lastFull) ? `<span class="v" style="bottom:calc(${h}% + 4px)">${esc(kfmt(p.value))}</span>` : ""}
    </div>`;
  }).join("");
  const every = points.length > 14 ? 7 : window.innerWidth < 640 ? 3 : 1;
  const labels = points.map((p, i) => `<span>${(points.length - 1 - i) % every === 0 ? esc(p.label) : ""}</span>`).join("");
  return `<div class="bars">${bars}</div><div class="xlabels" aria-hidden="true">${labels}</div>
    <div class="readout small muted" id="readout" role="status">${points[lastFull] ? esc(`${points[lastFull].long}: typical video ${nf(points[lastFull].value)} ${unit}. Orange is the best, striped is still collecting views. Hover or tap a bar for its numbers.`) : "No videos with numbers yet."}</div>`;
}

function changeChart(points, { noun = "followers", out = "readout2", note = "Green is new followers, red is followers lost. Hover or tap a bar for its number." } = {}) {
  const vals = points.map((p) => Number(p.value) || 0);
  const maxPos = Math.max(0, ...vals), maxNeg = Math.max(0, ...vals.map((v) => -v));
  const span = Math.max(1, maxPos + maxNeg);
  const zero = maxNeg ? (maxPos / span) * 100 : 100;
  let best = -1;
  points.forEach((p, i) => { if (!p.current && p.value != null && p.value > 0 && (best < 0 || vals[i] > vals[best])) best = i; });
  const bars = points.map((p, i) => {
    const v = vals[i], h = Math.max(v ? 2 : 0, (Math.abs(v) / span) * 100);
    const tip = p.value == null ? `${p.long}: no numbers yet` : `${p.long}: ${signed(p.value)} ${noun}${p.current ? " so far" : ""}`;
    const bar = !v ? "" : v > 0 ? `<div class="b" style="bottom:${100 - zero}%;height:${h}%"></div>` : `<div class="b neg" style="top:${zero}%;height:${h}%"></div>`;
    return `<div class="cbar ${p.current ? "cur" : ""}" tabindex="0" role="img" aria-label="${esc(tip)}" data-tip="${esc(tip)}" data-out="${out}">${bar}${i === best ? `<span class="v" style="bottom:calc(${100 - zero + h}% + 4px)">${esc(signed(v))}</span>` : ""}</div>`;
  }).join("");
  const every = points.length > 14 ? 7 : window.innerWidth < 640 ? 3 : 1;
  const labels = points.map((p, i) => `<span>${(points.length - 1 - i) % every === 0 ? esc(p.label) : ""}</span>`).join("");
  return `<div class="cbars">${maxNeg ? `<div class="zero" style="top:${zero}%"></div>` : ""}${bars}</div>
    <div class="xlabels" aria-hidden="true" style="border-top:1px solid rgba(255,255,255,0.2);padding-top:8px">${labels}</div>
    <div class="readout small muted" id="${out}" role="status">${esc(note)}</div>`;
}

// "on 20 Oct", "on 20 and 21 Oct", "over 5 days"
const dayList = (days = []) => {
  if (!days.length) return "";
  if (days.length > 2) return ` over ${days.length} days`;
  const d = days.map(parseDay);
  return d.length === 2 && d[0].getMonth() === d[1].getMonth() ? ` on ${d[0].getDate()} and ${fmtDay(d[1])}` : ` on ${d.map(fmtDay).join(" and ")}`;
};

function followersCard(f, ch) {

    ? startDay(f.days).map((x) => { const d = parseDay(x.date); return { label: `${d.getDate()} ${MON[d.getMonth()]}`, long: fmtDate(x.date), value: x.change, current: x.current }; })
    : startDay(f.weeks).map((x) => { const d = parseDay(x.start); return { label: `${d.getDate()} ${MON[d.getMonth()]}`, long: `Week of ${d.getDate()} ${MON[d.getMonth()]}`, value: x.change, current: x.current }; });
  const cls = (n) => (n > 0 ? "gain" : n < 0 ? "loss" : "");

    const t = thumbUrl(p.video?.videoUrl || "");

      <div style="text-align:right;min-width:140px"><div class="head ${cls(p.followers)}" style="font-size:22px;line-height:1.1">${esc(signed(p.followers))}</div><div class="small muted">followers${dayList(p.followerDays)} · ${nf(p.value)} views</div></div>
    </div>`;
  }).join("");
  return `<section class="card" aria-label="Followers">
    <div class="card-head"><h2>Followers</h2><span class="small muted">${ch === "all" ? "All channels together" : netName(ch)}</span></div>
    <div class="tiles">
      <div class="tile" style="background:var(--field)"><span class="lbl">Followers now</span><span class="num">${nf(f.now)}</span></div>

  </section>`;

// Email list from Instagram and Facebook DMs (ManyChat). Counts only.
function emailCard(e) {
  if (!e) return "";
  const startDay = (list) => { const i = list.findIndex((x) => x.change !== null); return list.slice(Math.max(0, Math.min(i < 0 ? 0 : i, list.length - 4))); };
  const points = state.range === "days"
    ? startDay(e.days).map((x) => { const d = parseDay(x.date); return { label: `${d.getDate()} ${MON[d.getMonth()]}`, long: fmtDate(x.date), value: x.change, current: x.current }; })
    : startDay(e.weeks).map((x) => { const d = parseDay(x.start); return { label: `${d.getDate()} ${MON[d.getMonth()]}`, long: `Week of ${d.getDate()} ${MON[d.getMonth()]}`, value: x.change, current: x.current }; });
  const share = (n) => (e.total ? `${Math.round((n / e.total) * 100)}%` : "–");

    e.carriedOver ? `${nf(e.carriedOver)} emails from earlier DMs were carried over on ${esc(dayLabel(e.carriedOn))}: they count in the list, not as new.` : "",

      <div class="tile" style="background:var(--field)"><span class="lbl">Confirmed</span><span class="num">${nf(e.confirmed)}</span><span class="sub">${share(e.confirmed)} · ${nf(e.pending)} waiting to confirm</span></div>
      <div class="tile" style="background:var(--field)"><span class="lbl">New, last 7 days</span><span class="num ${e.new7 > 0 ? "gain" : ""}">${esc(signed(e.new7))}</span><span class="sub">Last 4 weeks: ${esc(signed(e.new28))}</span></div>

}

    </div>`;
  }).join("");
  const tplRows = d.byTemplate.map((t) => `<tr>
      <td>${esc(t.name)}</td><td>${levelBadge(t.level)}</td><td class="n">${t.posts}</td><td class="n">${nf(t.typical)}</td>

    </div>

        <div class="seg" role="group" aria-label="Range"><button class="${state.range === "weeks" ? "on" : ""}" data-act="insRange" data-v="weeks" aria-pressed="${state.range === "weeks"}">Weeks</button><button class="${state.range === "days" ? "on" : ""}" data-act="insRange" data-v="days" aria-pressed="${state.range === "days"}">Days</button></div>
      </div>
      ${barChart(points, unit)}

      <section class="card" aria-label="Best videos">

        </section>
    <p class="small muted" style="margin:0">Numbers from Publer, updated ${esc(viennaStamp(d.refreshedAt))} (Vienna). They refresh every few hours.</p>`);
}

async function saveTemplate(form) {
  const err = document.getElementById("tplError"), btn = document.getElementById("tplSave");
  const val = (id) => (document.getElementById(id)?.value || "").trim();
  const on = (id) => !!document.getElementById(id)?.checked;
  const fail = (m) => { err.textContent = m; err.classList.remove("hidden"); };
  err.classList.add("hidden");
  const id = form.dataset.id;
  const was = id ? teamData("tpl").templates.find((t) => t.id === id) : null;
  const name = val("tplName"), level = form.querySelector('input[name="tplLevel"]:checked')?.value || "";
  if (!name) { document.getElementById("tplName").focus(); return fail("Give the template a name."); }
  if (!level) return fail("Pick a level.");
  const pay = val("tplPay"), needed = val("tplNeeded"), example = val("tplExample");
  if (pay && !(Number(pay) >= 0 && Number(pay) <= 100)) return fail("Pay must be a number between 0 and 100.");
  if (needed && !(Number.isInteger(Number(needed)) && Number(needed) >= 0 && Number(needed) <= 500)) return fail("Videos needed must be a whole number between 0 and 500.");
  if (example && !/^https:\/\/\S+$/i.test(example)) return fail("The example must be a link starting with https://.");
  const live = on("tplLive");
  if (live && !was?.live && !on("tplConfirm")) return fail("Tick the box to confirm editors may see this template and its pay.");
  btn.disabled = true; btn.textContent = "Saving…";
  try {
    await api("template-save", { id, name, level, pay, needed, example, brief: val("tplBrief"), textOnScreen: val("tplText"), caption: val("tplCaption"), music: val("tplMusic"), sound: val("tplSound"), active: on("tplActive"), live, confirmLive: on("tplConfirm") });
    teamDrop("tpl", "overview");
    if (isEditor()) state.data = null;
    toast(id ? "Saved." : "Template created.");
    go("#/team-templates");
  } catch (x) { fail(x.message); btn.disabled = false; btn.textContent = id ? "Save" : "Create template"; }
}

// Re-draws the schedule form (after adding or removing an athlete) without losing what was typed.
function keepForm(redraw) {
  const ids = ["pubCaption", "pubDate", "pubTime", "pubExtra", "pubTrial"];
  const vals = Object.fromEntries(ids.map((i) => [i, document.getElementById(i)?.value]));
  const draft = !!document.getElementById("pubDraft")?.checked;
  const check = document.getElementById("pubCaptionCheck")?.innerHTML || "";
  redraw();
  ids.forEach((i) => { const el = document.getElementById(i); if (el && vals[i] != null) el.value = vals[i]; });
  const box = document.getElementById("pubCaptionCheck"); if (box) box.innerHTML = check;
  const dr = document.getElementById("pubDraft");
  if (dr && draft) { dr.checked = true; dr.dispatchEvent(new Event("change", { bubbles: true })); }
  syncSlots();
}
function syncSlots() {
  const dt = document.getElementById("pubDate"), tm = document.getElementById("pubTime");
  if (!dt || !tm) return;
  app.querySelectorAll('[data-act="pickSlot"]').forEach((b) => b.classList.toggle("on", b.dataset.d === dt.value && b.dataset.t === tm.value));

/* ---------- caption check (suggestions only; the caption stays the editor's) ---------- */
const VERDICT = { "ready": ["Ready to go", "ok"], "small fixes": ["Small fixes", "fix"], "needs work": ["Needs work", "work"] };
const lastCheck = {};
function renderCheck(field) {
  const box = document.getElementById(field + "Check");
  const r = lastCheck[field];
  if (!box) return;
  if (!r) { box.innerHTML = ""; return; }
  const [label, cls] = VERDICT[r.verdict] || VERDICT["small fixes"];
  const spell = r.spelling.length ? `<div><div class="kv">Spelling and grammar</div><ul>${r.spelling.map((x, i) => `<li><span class="was">${esc(x.wrong)}</span><span aria-hidden="true">→</span><span class="now">${esc(x.right)}</span><button type="button" class="fixbtn-sm" data-act="applyFix" data-for="${field}" data-i="${i}">Fix</button></li>`).join("")}</ul></div>` : "";
  const tone = r.tone.length ? `<div><div class="kv">NLT tone</div><ul class="tone">${r.tone.map((t) => `<li>${esc(t)}</li>`).join("")}</ul></div>` : "";
  box.innerHTML = `<div class="check-box" role="status">
    <div class="vd ${cls}">${esc(label)}</div>
    ${spell}${tone}
    ${!spell && !tone ? `<div class="small muted">No spelling mistakes, and it fits the NLT voice.</div>` : ""}
    <div class="small muted">Suggestions only. The caption stays yours.</div>
  </div>`;
}

app.addEventListener("click", async (e) => {
  const el = e.target.closest("[data-act]");
  if (!el) return;
  const act = el.dataset.act;
  if (act === "logout") {
    try { if (!MOCK) await api("logout"); } catch { /* already out */ }
    store.token = null; state.data = null; go("#/login");
  }
  if (act === "retry") render();
  if (act === "rtab") { state.rtab = el.dataset.v; renderQueue(); }
  // Team area
  if (act === "makePlan") { state.plan = makePlan(teamData("pub")); renderPublish(); }
  if (act === "clearPlan") { state.plan = null; renderPublish(); }
  if (act === "runPlan" && !state.planRunning) runPlan();
  if (act === "reloadPub") {
    el.disabled = true;
    try { await teamGet("pub", "publish-queue", {}, true); state.plan = null; renderPublish(); } catch (x) { toast(x.message); el.disabled = false; }
  }
  if (act === "toggleCh" && state.sched) {
    const c = el.dataset.v, list = state.sched.channels;
    state.sched.channels = list.includes(c) ? list.filter((x) => x !== c) : ALL_CHANNELS.filter((x) => x === c || list.includes(x));
    el.classList.toggle("on"); el.setAttribute("aria-pressed", String(state.sched.channels.includes(c)));
  }
  if (act === "pickSlot") {
    document.getElementById("pubDate").value = el.dataset.d;
    document.getElementById("pubTime").value = el.dataset.t;
    const dr = document.getElementById("pubDraft");
    if (dr.checked) { dr.checked = false; dr.dispatchEvent(new Event("change", { bubbles: true })); }
    syncSlots();
  }
  if (act === "delAth" && state.sched) {
    state.sched.athletes = state.sched.athletes.filter((x) => x !== el.dataset.v);
    keepForm(() => renderSchedule(state.sched.id));
  }
  if (act === "insChannel") { state.channel = el.dataset.v; render(); }
  if (act === "insRange") { state.range = el.dataset.v; renderInsights(); }
  if (act === "insRefresh") {
    el.disabled = true; el.textContent = "Refreshing…";
    try { await teamGet("ins:" + state.channel, "insights", { channel: state.channel, refresh: true }, true); Object.keys(teamCache()).filter((k) => k.startsWith("ins:") && k !== "ins:" + state.channel).forEach((k) => teamDrop(k)); renderInsights(); toast("Numbers updated from Publer."); }
    catch (x) { toast(x.message); el.disabled = false; el.textContent = "Refresh"; }
  }
  if (act === "reloadQueue") {
    el.disabled = true;
    try { await ensureQueue(true); renderQueue(); } catch (x) { toast(x.message); el.disabled = false; }
  }
  if (act === "addNote") addNote();
  if (act === "delNote") {
    const d = draftFor(location.hash.slice(9));
    d.notes.splice(Number(el.dataset.i), 1);
    document.getElementById("noteList").innerHTML = noteList(d);
  }
  if (act === "seek") {
    const vid = document.getElementById("rvVideo");
    if (vid) { vid.currentTime = Number(el.dataset.t) || 0; vid.focus(); }
  }
  if (act === "decide") {
    const id = el.dataset.id, decision = el.dataset.v;
    const d = draftFor(id);
    const pending = document.getElementById("nText")?.value.trim();
    if (pending) addNote();
    const notes = notesText(d);
    const err = document.getElementById("rvError");
    err.classList.add("hidden");
    if (decision === "changes" && !notes) { err.textContent = "Add at least one note, so the editor knows what to fix."; err.classList.remove("hidden"); return; }
    const label = el.textContent;
    app.querySelectorAll('[data-act="decide"]').forEach((b) => { b.disabled = true; });
    el.textContent = decision === "approve" ? "Approving…" : "Sending…";
    try {
      await api("review", { id, decision, notes });
      delete state.drafts[id];
      teamDrop("overview", "pub");
      await ensureQueue(true);
      if (isEditor()) state.data = null;
      const next = state.queue.find((x) => (x.status === "Submitted" || x.status === "In Review") && x.id !== id);
      toast(decision === "approve" ? "Approved. It's in the Publishing table." : "Changes requested. The editor sees your notes in the portal.");
      go(next ? `#/review/${next.id}` : "#/review");
    } catch (x) {
      err.textContent = x.message; err.classList.remove("hidden");
      app.querySelectorAll('[data-act="decide"]').forEach((b) => { b.disabled = false; });
      el.textContent = label;
    }
  }
  if (act === "resend") {
    try { await api("request-code", { email: store.email }); toast("New code sent."); } catch (x) { toast(x.message); }
  }
  if (act === "period") { state.period = el.dataset.v; renderDashboard(); }
  if (act === "filter") { state.filter = el.dataset.v; state.shown = PAGE; renderDashboard(); }
  if (act === "more") { state.shown += PAGE; renderDashboard(); }
  if (act === "clearUpload") { e.preventDefault(); state.upload = null; document.getElementById("drop").innerHTML = dropzone("file"); }
  if (act === "clearReupload") {
    e.preventDefault(); state.reupload = null;
    document.getElementById("reDrop").innerHTML = dropzone("reFile");
    document.getElementById("reBtn").disabled = true;
    document.getElementById("reHint").textContent = "Add the new file first.";
  }
  if (act === "submit") {
    const err = document.getElementById("submitError");
    err.classList.add("hidden");
    const title = document.getElementById("title").value.trim();
    const fail = (m) => { err.textContent = m; err.classList.remove("hidden"); };
    const caption = document.getElementById("caption").value.trim();
    const music = document.getElementById("music").value.trim();
    const tplEl = document.getElementById("tpl");
    const templateId = tplEl ? tplEl.value : "own";
    if (!templateId) { tplEl.focus(); return fail("Pick the template you used, or Own idea."); }
    if (!state.upload) return fail("Upload the video file first.");
    if (!title) { document.getElementById("title").focus(); return fail("Give the video a title."); }
    if (!caption) { document.getElementById("caption").focus(); return fail("Add the caption."); }
    if (!MUSIC_URL.test(music)) { document.getElementById("music").focus(); return fail("Paste the Artlist link of the track you used."); }
    el.disabled = true; el.textContent = "Submitting…";
    try {
      await api("submit", { title, videoUrl: state.upload.url, caption, music, templateId });
      state.upload = null;
      await ensureData(true);
      go("#/"); toast("Submitted. It's in your list.");
    } catch (x) { fail(x.message); el.disabled = false; el.textContent = "Submit video"; }
  }
  if (act === "checkCaption") {
    const field = el.dataset.for;
    const ta = document.getElementById(field);
    const box = document.getElementById(field + "Check");
    if (!ta || !box) return;
    if (!ta.value.trim()) { box.innerHTML = `<div class="error">Write the caption first, then check it.</div>`; return; }
    const label = el.textContent;
    el.disabled = true; el.textContent = "Checking…";
    try {
      lastCheck[field] = await api("check-caption", { caption: ta.value, title: document.getElementById("title")?.value || "" });
      renderCheck(field);
    } catch (x) { box.innerHTML = `<div class="error">${esc(x.message)}</div>`; }
    el.disabled = false; el.textContent = label;
  }
  if (act === "applyFix") {
    const field = el.dataset.for, r = lastCheck[field], ta = document.getElementById(field);
    const fix = r && r.spelling[Number(el.dataset.i)];
    if (!fix || !ta) return;
    if (ta.value.includes(fix.wrong)) ta.value = ta.value.replace(fix.wrong, fix.right);
    r.spelling.splice(Number(el.dataset.i), 1);
    if (field === "caption") document.getElementById("capCount").textContent = `${ta.value.length} / 2,200 characters`;
    renderCheck(field);
  }
  if (act === "resubmit") {
    const err = document.getElementById("reError");
    err.classList.add("hidden");
    if (!state.reupload) return;
    const caption = document.getElementById("reCaption").value.trim();
    const music = document.getElementById("reMusic").value.trim();
    const fail = (m) => { err.textContent = m; err.classList.remove("hidden"); };
    if (!caption) return fail("Add the caption.");
    if (!MUSIC_URL.test(music)) return fail("Paste the Artlist link of the track you used.");
    el.disabled = true; el.textContent = "Sending…";
    try {
      await api("resubmit", { id: el.dataset.id, videoUrl: state.reupload.url, caption, music });
      state.reupload = null;
      await ensureData(true);
      render(); toast("New version sent. It's back in review.");
    } catch (x) { err.textContent = x.message; err.classList.remove("hidden"); el.disabled = false; el.textContent = "Submit new version"; }
  }
});

      const tone = c.length > 160 ? ["The caption runs long. NLT captions are one or two short lines; cut it to the first sentence and the question."] : [];
      if (/unleash|epic/i.test(c)) tone.push("Words like \u201cunleash\u201d and \u201cepic\u201d read like generic sport marketing. Describe what we see in the dive instead.");
      return { verdict: tone.length ? "needs work" : spelling.length ? "small fixes" : "ready", spelling, tone };
    }
    if (action === "review-queue") return { reviewer: window.__mock.reviewer, videos: JSON.parse(JSON.stringify(window.__mockQueue)) };
    if (action === "review") { const v = window.__mockQueue.find((x) => x.id === payload.id); Object.assign(v, { status: payload.decision === "approve" ? "Approved" : "Needs Resubmission", feedback: payload.notes, reviewed: iso(new Date()), reviewedBy: "Sample Reviewer", history: `${iso(new Date())} · Sample Reviewer · ${payload.decision === "approve" ? "Approved" : "Changes requested"}${payload.notes ? "\n" + payload.notes : ""}${v.history ? "\n\n" + v.history : ""}` }); return { ok: true }; }

    const team = mockTeam(action, payload);
    if (team) return team;
    return { ok: true };
  });
}
